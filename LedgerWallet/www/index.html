<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Wallet</title>
<style>
/* Inter + Inter Tight (SIL OFL 1.1) bundled locally — no network fetch at launch */
@font-face{font-family:Inter;src:url(fonts/inter-latin-400-normal.woff2)format('woff2');font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:Inter;src:url(fonts/inter-latin-500-normal.woff2)format('woff2');font-weight:500;font-style:normal;font-display:block;}
@font-face{font-family:Inter;src:url(fonts/inter-latin-600-normal.woff2)format('woff2');font-weight:600;font-style:normal;font-display:block;}
@font-face{font-family:Inter;src:url(fonts/inter-latin-700-normal.woff2)format('woff2');font-weight:700;font-style:normal;font-display:block;}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-600-normal.woff2)format('woff2');font-weight:600;font-style:normal;font-display:block;}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-700-normal.woff2)format('woff2');font-weight:700;font-style:normal;font-display:block;}
:root{
  box-sizing:border-box;
  --bg:#000;
  --card:#151515;
  --card-hi:#1f1f1f;
  --navpill:#2f2f2f;
  --txt:#fff;
  --sub:#8d8d92;
  --sub2:#5c5c61;
  --green:#6ec85c;
  --red:#ff4d4f;
  --chart-red:#f0526a;
  --chart-grn:#3ddc84;
  --purple:#a48afb;
  --m:16px;
  --hero:35px;   /* nudge if the headline runs wide/narrow on device */
  --sysui:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --sysdisp:"Inter Tight",Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  /* real iOS safe areas; floors keep it sane in a plain browser */
  --top:max(env(safe-area-inset-top,0px),24px);
  --bot:max(env(safe-area-inset-bottom,0px),14px);
}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overscroll-behavior:none;}
@supports (height:100dvh){html,body,#phone{height:100dvh;}}
body{
  background:#000;color:var(--txt);
  font-family:var(--sysui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  position:fixed;inset:0;              /* stop iOS Safari bouncing the whole page */
  touch-action:manipulation;           /* no double-tap zoom delay */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}
input{-webkit-user-select:text;user-select:text;}
#phone{
  position:relative;width:100%;height:100%;
  margin:0 auto;background:#000;overflow:hidden;
  display:flex;flex-direction:column;
}
/* desktop preview only (mouse + wide window): a phone body scaled to the window height */
@media (hover:hover) and (pointer:fine) and (min-width:500px){
  :root{--top:59px;--bot:34px;}
  body{background:#0a0a0c;display:flex;align-items:center;justify-content:center;}
  #phone{flex:0 0 auto;width:393px;height:852px;max-height:none;border-radius:48px;
    transform-origin:center;transform:scale(var(--fit,1));
    box-shadow:0 0 0 10px #1c1c1e,0 0 0 12px #2c2c2e,0 40px 90px rgba(0,0,0,.8);}
}

/* ============ SCROLL AREA ============ */
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:0;isolation:isolate;}
.sbspace{height:var(--top);}
/* progressive blur + darkening under the status bar once content scrolls beneath it */
.topfade{position:sticky;top:0;height:calc(var(--top) + 76px);margin-bottom:calc(-1 * (var(--top) + 76px));z-index:15;pointer-events:none;opacity:0;transition:opacity .22s ease;
  background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,rgba(0,0,0,.78) 55%,rgba(0,0,0,.3) 85%,transparent 100%);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%);}
.view.scrolled .topfade{opacity:1;}
.view::-webkit-scrollbar{display:none;}
.tail{height:118px;}
.tail-s{height:40px;}

/* ============ HOME HEADER ============ */
.hdr{display:flex;align-items:center;gap:10px;padding:0 var(--m);position:sticky;top:calc(var(--top) + 8px);z-index:20;height:48px;margin-top:8px;}
.hc{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.125);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;}
.hc:active{background:rgba(255,255,255,.2);}
.hc.av{background:rgba(255,255,255,.105);box-shadow:inset 0 0 0 2.6px rgba(255,255,255,.165);}
.hc .nd{position:absolute;top:0;left:36px;width:12px;height:12px;border-radius:50%;background:#f87274;}
.hc svg{width:26px;height:26px;}
.hc.end{margin-left:auto;}

/* ============ HERO ============ */
.hero{position:relative;padding:49px var(--m) 67px;}
.mesh{position:absolute;left:0;right:0;top:0;z-index:-1;pointer-events:none;overflow:hidden;}
.mesh canvas{display:block;width:100%;height:100%;}
.hero h1{position:relative;z-index:1;font-family:var(--sysdisp);font-size:var(--hero);line-height:42px;font-weight:600;letter-spacing:-0.5px;text-align:center;}
.hero p{position:relative;z-index:1;text-align:center;color:var(--sub);font-size:16px;margin-top:14px;}

/* ============ DUAL ACTION BUTTONS ============ */
.duo{display:flex;gap:8px;padding:0 var(--m);}
.duo button{flex:1;height:72px;background:var(--card);border:none;border-radius:16px;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:600;font-family:inherit;}
.duo button:active{background:#202020;}

/* ============ PROMO ============ */
.promo{margin:12px var(--m) 0;height:72px;background:var(--card);border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 14px;}
.promo h4{font-size:12.8px;font-weight:600;letter-spacing:-.2px;}
.promo p{font-size:11.4px;color:var(--sub);line-height:1.32;margin-top:3px;max-width:215px;}
.promo .x{position:absolute;top:9px;right:10px;width:19px;height:19px;color:#fff;opacity:.85;z-index:3;}
.dev{position:absolute;right:-14px;top:50%;width:132px;height:52px;z-index:1;
  transform:translateY(-50%) rotate(-15deg);border-radius:8px;
  background:linear-gradient(118deg,#8f949c 0%,#e9ecf1 18%,#a8adb6 38%,#f2f4f7 52%,#7d828a 72%,#c8ccd3 100%);
  box-shadow:-6px 8px 22px rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;}
.dev svg{opacity:.45;}

/* ============ SECTION HEADS ============ */
.sh{display:flex;align-items:center;justify-content:space-between;padding:22px var(--m) 11px;}
.sh .a{display:flex;align-items:center;gap:5px;font-family:var(--sysdisp);font-size:23px;font-weight:700;letter-spacing:-.6px;}
.sh .b{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);}
.h2{padding:22px var(--m) 8px;font-family:var(--sysdisp);font-size:23px;font-weight:700;letter-spacing:-.6px;}
.h2.row{display:flex;align-items:center;justify-content:space-between;}
.h2 .lnk{font-size:13.5px;color:var(--purple);font-weight:600;}

/* ============ TRENDING ============ */
.hscroll{display:flex;gap:8px;padding:0 var(--m);overflow-x:auto;scroll-snap-type:x proximity;}
.hscroll::-webkit-scrollbar{display:none;}
.tc{flex:0 0 96px;height:108px;background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;scroll-snap-align:start;}
.tc:active{background:#1e1e1e;}
.tc .n{font-size:13.5px;font-weight:600;letter-spacing:-.2px;}
.tc .c{font-size:12px;font-weight:600;}

/* ============ ASSET ROWS ============ */
.row{display:flex;align-items:center;gap:12px;height:64px;padding:0 var(--m);}
.row:active{background:#101010;}
.row .mid{flex:1;min-width:0;}
.row .t1{font-size:14.5px;font-weight:600;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .t2{font-size:12.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:6px;}
.row .r1{font-size:14.5px;font-weight:600;text-align:right;white-space:nowrap;}
.row .r2{font-size:12px;font-weight:600;text-align:right;margin-top:2px;display:flex;align-items:center;justify-content:flex-end;gap:3px;}
.rank{font-size:9.5px;color:var(--sub);background:#1c1c1c;border-radius:4px;padding:1.5px 5px;font-weight:600;letter-spacing:.2px;}

/* ============ CHIPS ============ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px var(--m) 2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:22px;padding:7px 14px 7px 7px;font-size:12.5px;font-weight:600;letter-spacing:-.1px;}
.chip .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;}

/* ============ BOTTOM NAV ============ */
.navwrap{position:absolute;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;
  padding-bottom:var(--bot);pointer-events:none;}
.nav{pointer-events:auto;display:flex;height:60px;align-items:center;padding:0 6px;
  background:rgba(38,38,40,.78);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border-radius:30px;box-shadow:0 10px 34px rgba(0,0,0,.55);}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:78px;height:48px;border-radius:24px;border:none;background:transparent;color:#96969b;font-size:10px;font-weight:600;font-family:inherit;}
.nb.on{color:#fff;background:rgba(84,84,88,.72);}
.nb svg{display:block;}

/* ============ TOP BAR ============ */
.tb{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--m);position:sticky;top:var(--top);z-index:20;}
.tb .ttl{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none;}
.ib{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:#fff;margin-left:-6px;}
.ib.r{margin-left:0;margin-right:-6px;}
.ib.circ{background:#1f1f1f;border-radius:50%;}
.tpill{display:flex;align-items:center;gap:8px;background:#1f1f1f;border-radius:20px;height:40px;padding:0 16px 0 8px;font-size:16.5px;font-weight:600;}
.tb.d{height:64px;}

/* ============ DETAIL ============ */
.dwrap{padding:17px var(--m) 0;}
.dlab{font-size:13.5px;color:var(--sub);}
.dprice{font-family:var(--sysdisp);font-size:43px;font-weight:700;letter-spacing:-1.5px;margin-top:7px;line-height:1.05;}
.dprice .c{color:var(--sub2);}
.dchg{display:flex;align-items:center;gap:6px;margin-top:11px;font-size:13px;font-weight:600;}
.dchg .m{color:var(--sub);font-weight:400;}
.chart{position:relative;margin:12px var(--m) 0;height:220px;}
.chart svg{display:block;width:100%;height:220px;}
.cflag{position:absolute;font-size:12px;font-weight:600;white-space:nowrap;transform:translateX(-50%);}
.cflag i{display:block;width:0;height:0;margin:2px auto 0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;}
.rng{display:flex;align-items:center;gap:6px;margin:24px var(--m) 0;}
.rtabs{flex:1;display:flex;background:#151515;border-radius:12px;padding:3px;}
.rt{flex:1;text-align:center;padding:7px 0;font-size:13.5px;font-weight:600;color:var(--sub);border-radius:9px;}
.rt.on{background:#313131;color:#fff;}
.rfil{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;}
.wide{display:flex;width:calc(100% - 32px);margin:32px var(--m) 0;height:48px;border-radius:24px;background:#1f1f1f;
  border:none;color:#fff;font-size:15px;font-weight:600;font-family:inherit;align-items:center;justify-content:center;gap:9px;}
.wide:active{background:#1e1e1e;}
.apy{margin:14px var(--m) 0;height:58px;background:var(--card);border-radius:14px;display:flex;align-items:center;padding:0 14px;gap:10px;}
.apy .tx b{font-size:14.5px;font-weight:600;display:block;}
.apy .tx s{font-size:13px;color:var(--sub);text-decoration:none;display:block;margin-top:1px;}
.sect{padding:24px var(--m) 0;}
.sect h3{font-family:var(--sysdisp);font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px;}
.st{display:flex;align-items:flex-start;justify-content:space-between;padding:7px 0;gap:12px;}
.st .k{font-size:16px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.st .k s{display:block;font-size:12px;color:var(--sub2);text-decoration:none;margin-top:2px;}
.st .v{font-size:16px;font-weight:600;text-align:right;}
.st .v s{display:block;font-size:12px;color:var(--sub);font-weight:400;text-decoration:none;margin-top:2px;}
.ii{width:14px;height:14px;border-radius:50%;border:1.2px solid var(--sub2);display:flex;align-items:center;justify-content:center;font-size:9px;font-style:italic;font-weight:700;color:var(--sub2);flex:0 0 auto;}
.src{padding:18px var(--m) 0;font-size:13.5px;color:var(--sub2);}
#dockwrap{position:absolute;left:0;right:0;bottom:0;z-index:65;pointer-events:none;}
#dockwrap:empty{display:none;}
.dock{pointer-events:auto;display:flex;gap:8px;align-items:center;padding:0 var(--m) calc(var(--bot) + 17px);}
.dock button{height:45px;border-radius:23px;font-size:15px;font-weight:600;border:none;font-family:inherit;}
.dock .b1{flex:1;background:#1f1f1f;color:#fff;}
.dock .b2{flex:1;background:#fff;color:#000;}
.dock .b3{width:45px;background:var(--card);color:#fff;flex:0 0 45px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* ============ SEARCH + TABS ============ */
.sfield{margin:10px var(--m) 0;height:48px;background:var(--card);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--sub);font-size:16px;}
.sfield.on{border:1.5px solid #3b3b3b;color:#fff;}
.cur{width:2px;height:20px;background:var(--purple);animation:bl 1s steps(2,start) infinite;}
@keyframes bl{50%{opacity:0}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:14px var(--m) 0;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:8px 14px;font-size:14.5px;font-weight:600;color:var(--sub);border-radius:9px;white-space:nowrap;}
.tab.on{background:#232323;color:#fff;}
.utabs{display:flex;gap:20px;overflow-x:auto;padding:14px var(--m) 0;}
.utabs::-webkit-scrollbar{display:none;}
.ut{flex:0 0 auto;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:.4px;padding-bottom:7px;white-space:nowrap;border-bottom:2px solid transparent;}
.ut.on{color:#fff;border-bottom-color:#fff;}
.seg{display:flex;gap:3px;overflow-x:auto;margin:14px 0 0;padding:0 var(--m);}
.seg::-webkit-scrollbar{display:none;}
.sg{flex:0 0 auto;padding:9px 15px;font-size:14px;font-weight:600;color:var(--sub);border-radius:10px;white-space:nowrap;}
.sg.on{background:#232323;color:#fff;}

/* ============ MARKET SUMMARY ============ */
.msum{display:flex;gap:8px;overflow-x:auto;padding:14px var(--m) 0;}
.msum::-webkit-scrollbar{display:none;}
.mc{flex:0 0 auto;min-width:150px;height:62px;background:var(--card);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.mc .l{font-size:12.5px;color:var(--sub);}
.mc .v{font-size:17px;font-weight:700;letter-spacing:-.4px;margin-top:3px;display:flex;align-items:center;gap:6px;}
.mc .v em{font-size:12px;font-style:normal;font-weight:600;}

/* ============ EMPTY ============ */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 30px;text-align:center;}
.empty .o{width:70px;height:70px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.empty h3{font-size:19px;font-weight:600;}
.empty p{font-size:14.5px;color:var(--sub);margin-top:7px;line-height:1.4;}

/* ============ DISCOVER ============ */
.pv{display:flex;align-items:center;gap:13px;padding:11px var(--m);}
.pv:active{background:#101010;}
.pv.hl{background:linear-gradient(90deg,rgba(124,96,214,.30),rgba(124,96,214,.09));margin:0 10px;border-radius:14px;padding:11px 12px;}
.pv .pi{width:48px;height:48px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;}
.pv .pn{font-size:15px;font-weight:600;letter-spacing:.5px;font-family:ui-monospace,"SF Mono",Menlo,monospace;}
.pv .pu{font-size:12.5px;color:var(--sub);margin-top:3px;font-family:ui-monospace,"SF Mono",Menlo,monospace;}

/* ============ SWAP ============ */
.swp{padding:8px var(--m) 0;position:relative;}
.sbox{border-radius:16px;padding:16px;min-height:96px;}
.sbox.a{border:1px solid #2a2a2a;}
.sbox.b{background:var(--card);margin-top:8px;}
.sbox .lb{font-size:14px;color:var(--sub);}
.sbox .rowx{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.sbox .amt{font-size:30px;font-weight:600;color:#4a4a4a;}
.pick{display:flex;align-items:center;gap:6px;background:#242424;border-radius:20px;padding:9px 14px;font-size:15px;font-weight:600;}
.sbox .fiat{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin-top:9px;}
.flip{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:44px;height:44px;border-radius:13px;background:#242424;border:3px solid #000;display:flex;align-items:center;justify-content:center;z-index:4;}
.quotes{position:absolute;left:var(--m);right:var(--m);bottom:calc(110px + env(safe-area-inset-bottom,0px));height:50px;border-radius:25px;background:#181818;color:#4d4d4d;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}

/* ============ EARN ============ */
.ecards{display:flex;gap:8px;overflow-x:auto;padding:10px var(--m) 0;}
.ecards::-webkit-scrollbar{display:none;}
.ec{flex:0 0 104px;height:118px;background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;}
.ec .nm{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.ec .rt2{font-size:12px;font-weight:600;color:var(--green);background:rgba(40,209,124,.14);border-radius:7px;padding:3px 8px;}
.ecw{position:relative;}
.ecw .badge{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#3a3a5c;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;}
.hw{margin:0 var(--m);}
.hwr{height:54px;background:var(--card);border-radius:13px;display:flex;align-items:center;gap:13px;padding:0 15px;margin-bottom:8px;font-size:15.5px;font-weight:600;}
.disc{padding:22px var(--m) 0;font-size:12.5px;color:var(--sub2);line-height:1.45;}
.pillbtn{display:block;margin:20px auto 0;background:#fff;color:#000;border:none;border-radius:22px;height:44px;padding:0 24px;font-size:15.5px;font-weight:600;font-family:inherit;}

/* ============ CARD ============ */
.ccard{margin:56px auto 0;width:250px;height:230px;position:relative;}
.cc{position:absolute;border-radius:12px;}
.cc.back{width:200px;height:126px;left:14px;top:86px;background:linear-gradient(150deg,#1a1a1c,#0d0d0f);
  transform:rotate(-14deg) skewX(-6deg);box-shadow:0 18px 40px rgba(0,0,0,.7);border:1px solid rgba(255,120,60,.45);}
.cc.front{width:196px;height:124px;left:44px;top:18px;transform:rotate(-14deg) skewX(-6deg);
  background:linear-gradient(150deg,#16161c,#0a0a10);box-shadow:0 20px 44px rgba(0,0,0,.75);overflow:hidden;}
.cc.front .dots{position:absolute;inset:0;
  background:linear-gradient(115deg,#ff7a2f 0%,#ffd84d 22%,#8ee85a 42%,#4ad9e0 60%,#6f7cff 78%,transparent 92%);
  -webkit-mask-image:radial-gradient(circle at 1px 1px,#000 1.1px,transparent 1.3px);
  mask-image:radial-gradient(circle at 1px 1px,#000 1.1px,transparent 1.3px);
  -webkit-mask-size:6px 6px;mask-size:6px 6px;opacity:.95;}
.mcirc{position:absolute;right:16px;bottom:12px;display:flex;}
.mcirc i{width:20px;height:20px;border-radius:50%;display:block;}

/* ============ SHEET ============ */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;transition:opacity .22s;}
.scrim.on{opacity:1;}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:90;background:#1c1c1c;border-radius:20px 20px 0 0;
  padding:10px 0 calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.sheet.on{transform:translateY(0);}
.grab{width:36px;height:4px;border-radius:2px;background:#48484a;margin:0 auto 12px;}
.sheet .sh2{display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;padding-bottom:10px;}
.sheet .sh2 .x{position:absolute;right:18px;top:-2px;width:26px;height:26px;color:var(--sub);}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:16px;}
.opt.off{color:var(--sub2);}
.opt:active{background:#242424;}

/* ============ KEYBOARD ============ */
.kb{position:absolute;left:0;right:0;bottom:0;z-index:75;background:#1c1c1e;padding:7px 3px calc(6px + env(safe-area-inset-bottom,0px));}
.kr{display:flex;justify-content:center;gap:5px;margin-bottom:9px;}
.kk{height:40px;flex:1;max-width:32px;background:#5a5a5e;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:400;box-shadow:0 1px 0 rgba(0,0,0,.4);}
.kk.w{max-width:44px;background:#3a3a3c;}
.kk.sp{max-width:none;flex:4;}
.kk.d{background:#3a3a3c;}
.fade{animation:fd .2s ease;}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ COIN ICON ============ */
.ci{border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#1c1c1e;}

/* ============ PORTFOLIO HERO ============ */
.pf{position:relative;padding:34px var(--m) 30px;text-align:center;}
.pf .lab{position:relative;z-index:1;font-size:14px;color:var(--sub);}
.pf .tot{position:relative;z-index:1;font-family:var(--sysdisp);font-size:44px;font-weight:700;letter-spacing:-1.6px;margin-top:5px;line-height:1.05;}
.pf .tot .c{color:var(--sub2);}
.pf .d{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:15px;font-weight:600;}
.pf .d .m{color:var(--sub);font-weight:400;}
.syncing{position:relative;z-index:1;margin-top:10px;font-size:12.5px;color:var(--sub2);display:flex;align-items:center;justify-content:center;gap:6px;}
.spin{width:11px;height:11px;border:1.6px solid var(--sub2);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ ADD / MANAGE ============ */
.addbtn{width:30px;height:30px;border-radius:50%;background:#232323;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.addbtn:active{background:#303030;}
.addrow{margin:2px var(--m) 0;height:58px;border:1.4px dashed #333;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15.5px;font-weight:600;color:var(--sub);}
.addrow:active{background:#0e0e0e;}
.amt2{font-size:13.5px;color:var(--sub);margin-top:2px;}

/* ============ FULL-SCREEN SHEET ============ */
.fs{position:absolute;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;
  padding-top:var(--top);transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
.fs.on{transform:translateY(0);}
.fs .hd{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--m);position:relative;flex:0 0 auto;}
.fs .hd .t{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none;}
.fs .bd{flex:1 1 auto;overflow-y:auto;}
.fs .bd::-webkit-scrollbar{display:none;}
.txt{background:none;border:none;color:#fff;font-family:inherit;font-size:16px;outline:none;width:100%;}
.txt::placeholder{color:var(--sub);}

/* amount entry */
.aewrap{flex:1 1 auto;display:flex;flex-direction:column;}
.ae{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--m);}
.ae .tk{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin-bottom:22px;}
.ae .big{font-family:var(--sysdisp);font-size:52px;font-weight:700;letter-spacing:-1.8px;line-height:1;display:flex;align-items:baseline;gap:8px;}
.ae .big .u{font-size:26px;color:var(--sub);letter-spacing:-.5px;}
.ae .big .ph{color:#3a3a3a;}
.ae .usd{font-size:16px;color:var(--sub);margin-top:12px;}
.ae .err{font-size:13.5px;color:var(--red);margin-top:10px;min-height:16px;}
.pad{flex:0 0 auto;padding:0 10px calc(var(--bot) + 8px);}
.pr{display:flex;gap:8px;margin-bottom:8px;}
.pk{flex:1;height:54px;border-radius:14px;background:#161616;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:500;font-family:var(--sysdisp);}
.pk:active{background:#242424;}
.pk.fn{background:transparent;font-size:20px;}
.act{display:flex;gap:10px;padding:0 var(--m) 10px;}
.act button{flex:1;height:50px;border-radius:25px;border:none;font-size:16px;font-weight:600;font-family:inherit;}
.act .save{background:#fff;color:#000;}
.act .save[disabled]{background:#242424;color:#4d4d4d;}
.act .del{flex:0 0 50px;background:#241416;color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.tag{font-size:12px;font-weight:600;color:var(--green);background:rgba(40,209,124,.14);border-radius:6px;padding:2px 7px;margin-left:7px;}
/* ============ FUNDED HOME ============ */
.pf .lab{display:flex;align-items:center;justify-content:center;gap:6px;}
.eye{background:none;border:none;color:var(--sub);display:flex;align-items:center;padding:4px;margin:-4px;}
.mask{letter-spacing:2px;color:#fff;}
.duo.tri button{height:72px;font-size:14px;}
.syncing{cursor:pointer;}

/* ============ CHART ============ */
.chart{touch-action:pan-y;-webkit-user-select:none;user-select:none;}
.chart .mk{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #000;transform:translate(-50%,-50%);pointer-events:none;z-index:2;}
.chart .mk.in{background:var(--green);}
.chart .mk.out{background:#fff;}
.chart .scr-l{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);opacity:0;pointer-events:none;transform:translateX(-.5px);}
.chart .scr-d{position:absolute;width:12px;height:12px;border-radius:50%;border:2.5px solid #000;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:3;}
.chart.scrub .scr-l,.chart.scrub .scr-d{opacity:1;}
.chart.scrub .cflag,.chart.scrub .mk{opacity:0;}
.chart .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:0 30px;}
.chart .skel{position:absolute;left:16px;right:16px;top:50%;height:2px;border-radius:1px;
  background:linear-gradient(90deg,#161616 0%,#2e2e2e 50%,#161616 100%);background-size:200% 100%;animation:shim 1.1s linear infinite;}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.rfil.off{opacity:.35;}
.cap-note{padding:6px var(--m) 0;font-size:11.5px;color:var(--sub2);text-align:center;}

/* ============ BALANCE CARD + P&L ============ */
.balcard{margin:14px var(--m) 0;background:var(--card);border-radius:14px;padding:14px;}
.balcard .br{display:flex;align-items:center;justify-content:space-between;}
.balcard .bq{font-size:15px;font-weight:600;}
.balcard .bs{font-size:12.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;justify-content:flex-end;gap:2px;}
.balcard .bs svg{width:12px;height:12px;}
.balcard .bdiv{height:1px;background:#222;margin:12px 0 4px;}
.balcard .br.sm{padding:6px 0 0;font-size:13px;color:var(--sub);}
.balcard .br.sm b{color:#fff;font-weight:600;}
.pnl{margin:0 var(--m);background:var(--card);border-radius:14px;padding:4px 14px;}
.pr2{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px;color:var(--sub);border-bottom:1px solid #1f1f1f;}
.pr2:last-child{border-bottom:none;}
.pr2 b{font-weight:600;color:#fff;}
.pr2 em{font-style:normal;font-weight:500;opacity:.8;}
.pr2.tot span{color:#fff;font-weight:600;}
.rowh{display:flex;align-items:center;justify-content:space-between;}
.lnk2{font-size:13.5px;font-weight:600;color:var(--purple);font-family:var(--sysui);letter-spacing:0;}
.ii.big{width:17px;height:17px;font-size:10.5px;margin-left:8px;margin-right:auto;cursor:pointer;}

/* ============ ALLOCATION ============ */
.abar{display:flex;gap:2px;height:10px;margin:2px var(--m) 8px;border-radius:5px;overflow:hidden;}
.abar i{display:block;height:100%;min-width:3px;}
.row.alloc{height:56px;gap:10px;}
.row.alloc .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.linkrow{margin:18px var(--m) 0;height:54px;background:var(--card);border-radius:13px;display:flex;align-items:center;gap:8px;padding:0 15px;font-size:15px;font-weight:600;}
.linkrow span:first-child{flex:1;}
.linkrow .cnt{font-size:13px;color:var(--sub);font-weight:500;}
.linkrow svg{color:var(--sub);}
.disc2{padding:18px var(--m) 0;font-size:11.5px;color:var(--sub2);line-height:1.45;}

/* ============ TRANSACTIONS ============ */
.dayh{padding:18px var(--m) 6px;font-size:13px;font-weight:600;color:var(--sub);}
.row.op{height:60px;}
.opi{position:relative;flex:0 0 auto;}
.ob{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;border:2.5px solid #000;display:flex;align-items:center;justify-content:center;}
.ob.in{background:var(--green);}
.ob.out{background:#e5e5ea;}

/* ============ ADD SHEET EXTRAS ============ */
.pxbtn{display:block;margin:10px auto 0;background:#1c1c1c;border:none;color:var(--sub);font-family:inherit;font-size:13px;font-weight:500;border-radius:14px;padding:6px 12px;}
.maxchip{margin-top:4px;background:#242424;border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;border-radius:14px;padding:6px 14px;}
.note{margin-top:14px;font-size:12px;color:var(--sub2);text-align:center;max-width:260px;}
.avail{font-size:12.5px;color:var(--sub);font-weight:500;margin-left:6px;}
.info{padding:4px 20px 8px;}
.info b{display:block;font-size:14px;margin-top:12px;}
.info p{font-size:13.5px;color:var(--sub);line-height:1.45;margin-top:3px;}


/* ============ SWAP (interactive) ============ */
.quotes{border:none;font-family:inherit;transition:background .15s,color .15s;}
.quotes.on{background:#fff;color:#000;}
.sbox input.amt{background:none;border:none;outline:none;font-family:inherit;color:#fff;min-width:0;flex:1;padding:0;margin-right:10px;caret-color:var(--purple);-webkit-user-select:text;user-select:text;}
.sbox input.amt::placeholder{color:#4a4a4a;}
.sbox .amt.on{color:#fff;}
.sbox .lb{display:flex;align-items:center;justify-content:space-between;}
.sbox .bal{font-size:12.5px;color:var(--sub);}
.sbox .fiat{justify-content:space-between;min-height:17px;}
.sbox .fiat .bad{color:#ff4d4f;}
.maxs{background:#242424;border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;border-radius:12px;padding:4px 10px;}
.pk2{flex:0 0 auto;}
.pick.sel{padding:6px 12px 6px 6px;gap:7px;}
.qcard{margin:4px 16px 0;background:#242424;border-radius:14px;padding:6px 14px;}
.qh{display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px;font-size:15px;font-weight:600;}
.qtag{font-size:11.5px;font-weight:600;color:var(--sub);background:#1a1a1a;border-radius:6px;padding:2px 7px;}
.qr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px;color:var(--sub);border-top:1px solid #2e2e2e;}
.qh+.qr,.qcard>.qr:first-child{border-top:none;}
.qr span{display:flex;align-items:center;gap:7px;}
.qr b{color:#fff;font-weight:600;text-align:right;}
.qr.tot b{font-size:15px;}
.note2{padding:12px 20px 14px;font-size:12.5px;color:var(--sub);line-height:1.45;}
.act .ghost{background:#2a2a2a;color:#fff;}
.act .save.danger{background:#ff4d4f;color:#fff;}
.dim{color:var(--sub);font-weight:400;font-size:13.5px;margin-left:4px;}
.opt>span{display:flex;align-items:baseline;gap:2px;}

/* ============ SETTINGS ============ */
.scard{margin:0 var(--m) 8px;background:var(--card);border-radius:14px;padding:15px 14px 15px 16px;display:flex;align-items:center;gap:12px;}
.scard:active,.srow[onclick]:active{background:#1c1c1c;}
.tt{font-size:15.5px;font-weight:600;letter-spacing:-.2px;}
.ds{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.38;}
.cv{color:var(--sub2);display:flex;}
.sgrp{padding-top:4px;}
.srow{display:flex;align-items:center;gap:14px;padding:13px var(--m);min-height:60px;}
.srow.danger .tt{color:#ff4d4f;}
.val{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:14.5px;white-space:nowrap;flex:0 0 auto;}
.tgl{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:0 0 auto;transition:background .2s;}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3);}
.tgl.on{background:#30d158;}
.tgl.on::after{transform:translateX(20px);}
.sfoot{text-align:center;font-size:12.5px;color:var(--sub2);padding:22px 0 0;}
.atile{flex:1;height:76px;background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.atile:active{background:#1e1e1e;}
.adddev{margin:0 var(--m);height:58px;border:1.4px dashed #3a3a3a;border-radius:13px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:16px;font-weight:600;}
.adddev:active{background:#0e0e0e;}
.pv{cursor:pointer;}
.hwr:active,.ec:active{background:#1e1e1e;}

/* regional market indicator: Eastern shows increases in red */
html.east{--green:#ff4d4f;--red:#6ec85c;}

/* ============ TOAST ============ */
.toast{position:absolute;left:50%;top:calc(var(--top) + 6px);z-index:120;transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  background:rgba(44,44,46,.96);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:20px;white-space:nowrap;transition:opacity .2s,transform .2s;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ============ APP LOCK ============ */
#lock{position:absolute;inset:0;z-index:110;background:#000;}
.lk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(var(--top) + 20px) 0 calc(var(--bot) + 6px);position:relative;}
.lkx{position:absolute;top:calc(var(--top) + 8px);left:var(--m);margin:0;}
.lkic{width:56px;height:56px;border-radius:50%;background:#1c1c1c;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.lkt{font-family:var(--sysdisp);font-size:24px;font-weight:700;letter-spacing:-.5px;}
.lks{font-size:14.5px;color:var(--sub);margin-top:8px;text-align:center;padding:0 30px;line-height:1.4;}
.lks.bad{color:#ff4d4f;}
.lkd{display:flex;gap:18px;margin:28px 0 36px;}
.lkd i{width:14px;height:14px;border-radius:50%;border:1.6px solid #6a6a6e;display:block;transition:background .1s;}
.lkd i.on{background:#fff;border-color:#fff;}
.lkd.shake{animation:shk .35s;}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lkp{width:100%;padding:0 26px;}
.lkp .pk{height:64px;font-size:26px;border-radius:32px;}
.lkf{background:none;border:none;color:var(--purple);font-family:inherit;font-size:15px;font-weight:600;height:44px;}

/* ============ FULL SCREEN (home-screen web app / native app) ============ */
html.full,html.full body{height:var(--appH)!important;}
html.full body{bottom:auto;}
html.full:not(.rot) #phone{height:var(--appH)!important;}

/* ============ PORTRAIT LOCK (phone turned sideways) ============ */
html.rot{--top:max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px),24px);--bot:14px;}
html.rot body{background:#000;}
html.rot #phone{position:fixed;left:50%;top:50%;transform-origin:center center;max-width:none;max-height:none;border-radius:0;box-shadow:none;}

/* ============ PULL TO REFRESH (rubber band) ============ */
.view.pulling>*:not(.topfade):not(.sbspace):not(.mesh):not(.hdr):not(.tb){transform:translate3d(0,var(--pull,0px),0);}
.view.springing>*:not(.topfade):not(.sbspace):not(.mesh):not(.hdr):not(.tb){transition:transform .52s cubic-bezier(.19,1,.22,1);}
</style>
</head>

function series(seed,n){let r=seed,o=[],v=.52;
 const rnd=()=>{r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff;};
 for(let i=0;i<n;i++){v+=(rnd()-.48)*.30;if(rnd()>.93)v+=(rnd()-.5)*.55;v=Math.max(.08,Math.min(.94,v));o.push(v);}return o;}
function chart(seed,pos){
 const W=361,H=190,n=60,p=series(seed,n);
 let hi=0,lo=0;p.forEach((v,i)=>{if(v>p[hi])hi=i;if(v<p[lo])lo=i;});
 const X=i=>i/(n-1)*W, Y=v=>H-14-v*(H-46);
 let d='M'+X(0).toFixed(1)+' '+Y(p[0]).toFixed(1);
 for(let i=1;i<n;i++){const x0=X(i-1),x1=X(i),m=(x0+x1)/2;
  d+='C'+m.toFixed(1)+' '+Y(p[i-1]).toFixed(1)+','+m.toFixed(1)+' '+Y(p[i]).toFixed(1)+','+x1.toFixed(1)+' '+Y(p[i]).toFixed(1);}
 const raw=pos?upCol():dnCol(),id='cg'+seed;
 return{svg:'<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
  +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+raw+'" stop-opacity=".30"/><stop offset="1" stop-color="'+raw+'" stop-opacity="0"/></linearGradient></defs>'
  +'<path d="'+d+' L'+W+' '+H+' L0 '+H+' Z" fill="url(#'+id+')"/>'
  +'<path d="'+d+'" fill="none" stroke="'+raw+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  hi:{x:X(hi)/W*100,y:Y(p[hi])/H*190},lo:{x:X(lo)/W*100,y:Y(p[lo])/H*190}};}

/* network: native bridge inside the iOS app, plain fetch in a browser */
let NETID=0;const NETQ={};
window.__netResolve=function(id,ok,body){const p=NETQ[id];if(!p)return;delete NETQ[id];
 ok?p.res(body):p.rej(new Error('net'));};
function netGet(url){
 const mh=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.net;
 if(mh)return new Promise(function(res,rej){const id=++NETID;NETQ[id]={res:res,rej:rej};
  mh.postMessage({id:id,url:url});
  setTimeout(function(){if(NETQ[id]){delete NETQ[id];rej(new Error('timeout'));}},25000);});
 const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
 const tm=ctl?setTimeout(function(){ctl.abort();},20000):0;
 return fetch(url,ctl?{signal:ctl.signal}:undefined)
  .then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('http');return r.text();},
        function(e){clearTimeout(tm);throw e;});}

function meshCanvas(pal,W,top){
 const m=MESH[pal],gi=MESHIMG[pal+'g'],bi=MESHIMG[pal+'b'];
 if(!m||!gi||!bi||!gi.complete||!bi.complete||!gi.naturalWidth||!bi.naturalWidth)return null;

 const c=mk(),x=c.getContext('2d');x.scale(dpr,dpr);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
 const dx=-st/2*sx,dy=top-59-st/2,dw=bi.naturalWidth*st*sx,dh=bi.naturalHeight*st;

 y.drawImage(gi,dx,dy,gi.naturalWidth*st*sx,gi.naturalHeight*st);

 y.translate(W/2,Hc/2);y.rotate((m.ang-90)*Math.PI/180);
 const sp=m.sp,r=m.rr*sp,R=Math.hypot(W,Hc)/2+sp,n=Math.ceil(R/sp);

 for(let i=-n;i<=n;i++)for(let j=-n;j<=n;j++){const px=i*sp,py=j*sp;y.moveTo(px+r,py);y.arc(px,py,r,0,Math.PI*2);}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function logOp(s,type,amt,label,px){
 if(!(amt>0))return;
 OPS.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),t:Date.now(),s:s,type:type,
  label:label,amt:amt,px:(px>0?px:priceOf(s))});
 saveOps();}

/* bring the history in line with balances (first run on older data) */
(function reconcile(){
 const q={};OPS.forEach(function(o){q[o.s]=(q[o.s]||0)+(o.type==='in'?o.amt:-o.amt);});
 let changed=false;
 Object.keys(HOLD).forEach(function(s){if(!BYSYM[s])return;
  const d=(HOLD[s]||0)-(q[s]||0);
  if(Math.abs(d)>1e-12){changed=true;OPS.push({id:'r'+s+Date.now().toString(36),t:Date.now(),s:s,
   type:d>0?'in':'out',label:d>0?'Received':'Sent',amt:Math.abs(d),px:priceOf(s)});}});
 if(changed){OPS.sort(function(a,b){return a.t-b.t;});saveOps();}})();

/* average-cost P&L: sends and sales realise gains at the average entry price */
function pnlOf(s){let qty=0,cost=0,real=0;
 OPS.filter(function(o){return o.s===s;}).sort(function(a,b){return a.t-b.t;}).forEach(function(o){
  if(o.type==='in'){qty+=o.amt;cost+=o.amt*o.px;}
  else{const a=Math.min(o.amt,qty),avg=qty>0?cost/qty:0;real+=(o.px-avg)*a;cost-=avg*a;qty-=a;}});
 if(qty<1e-12){qty=0;cost=0;}
 const unreal=qty>0?qty*priceOf(s)-cost:0;
 return {qty:qty,avg:qty>0?cost/qty:0,cost:cost,real:real,unreal:unreal,total:unreal+real,pct:cost>0?unreal/cost*100:0};}
function pnlAll(){let cost=0,unreal=0,real=0;
 Array.from(new Set(OPS.map(function(o){return o.s;}))).forEach(function(s){
  const p=pnlOf(s);cost+=p.cost;unreal+=p.unreal;real+=p.real;});
 return {cost:cost,unreal:unreal,real:real,total:unreal+real,pct:cost>0?unreal/cost*100:0};}

/* CoinGecko's keyless tier allows as few as 5 calls/min — every call goes
   through this queue so the app never trips the limit. Charts jump the line. */
const CG_PER_MIN=5,CG_GAP=1500;
const CGQ=[];let CGT=[],CGLAST=0,CGTIMER=0;
function cgGet(url,urgent){return new Promise(function(res,rej){
 const job={url:url,res:res,rej:rej};if(urgent)CGQ.unshift(job);else CGQ.push(job);pumpCG();});}
function pumpCG(){
 if(CGTIMER||!CGQ.length)return;
 const now=Date.now();CGT=CGT.filter(function(t){return now-t<60000;});
 let wait=Math.max(0,CGLAST+CG_GAP-now);
 if(CGT.length>=CG_PER_MIN)wait=Math.max(wait,CGT[0]+60050-now);
 if(wait>0){CGTIMER=setTimeout(function(){CGTIMER=0;pumpCG();},wait);return;}
 const j=CGQ.shift();CGLAST=now;CGT.push(now);
 jget(j.url).then(j.res,j.rej);
 if(CGQ.length)pumpCG();}

 LIVE[r.id]={p:r.current_price,c:r.price_change_percentage_24h||0,cap:r.market_cap,rk:r.market_cap_rank,
  vol:r.total_volume,sup:r.circulating_supply,max:r.max_supply,ath:r.ath,athd:r.ath_date,atl:r.atl,atld:r.atl_date,img:r.image};
 remember({id:r.id,s:String(r.symbol||'').toUpperCase(),n:r.name,img:r.image});}

 if(SYNC===1)return REFRESHING;

 if(force)Object.keys(CHARTS).forEach(function(k){if(CHARTS[k]&&CHARTS[k].err)delete CHARTS[k];});
 SYNC=1;updateSync();

 const main=cgGet(CG+'/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&price_change_percentage=24h')
  .then(function(rows){if(!Array.isArray(rows)||!rows.length)throw new Error('shape');
   rows.forEach(storeMarket);
   TOP=rows.slice(0,100).map(function(r){return {id:r.id,s:String(r.symbol||'').toUpperCase(),n:r.name,img:r.image,
    p:r.current_price,c:r.price_change_percentage_24h||0,cap:r.market_cap,rk:r.market_cap_rank};});
   lsSet('wallet.top',TOP);

   const held={};heldSyms().forEach(function(s){held[BYSYM[s][3]]=1;});
   const miss=CATALOG.map(function(c){return c[3];}).filter(function(id){return !have[id]&&(held[id]||!LIVE[id]);});
   if(miss.length)return cgGet(CG+'/coins/markets?vs_currency=usd&ids='+miss.join(',')+'&per_page=250&page=1&price_change_percentage=24h')
    .then(function(r2){if(Array.isArray(r2))r2.forEach(storeMarket);},function(){});})
  .then(function(){LAST=Date.now();lsSet('wallet.lastSync',LAST);SYNC=0;},function(){SYNC=2;});
 /* trending, market cap and mood change slowly — every 10 minutes is plenty */
 const side=[];
 if(SET.cur!=='USD'&&(!FX||Date.now()-FX.at>36e5))side.push(loadFx());
 if(Date.now()-SLOWAT>6e5||!TRENDING||!GLOBAL||!FNG){
  side.push(cgGet(CG+'/search/trending').then(function(j){
   const a=((j&&j.coins)||[]).map(function(x){const it=x.item||{},d=it.data||{},pc=d.price_change_percentage_24h;
    return {id:it.id,s:String(it.symbol||'').toUpperCase(),n:it.name,img:it.large||it.small||it.thumb,
     c:(pc&&typeof pc.usd==='number')?pc.usd:null,p:(typeof d.price==='number')?d.price:null};})
    .filter(function(x){return x.id&&x.c!=null;}).slice(0,10);
   if(a.length){TRENDING=a;a.forEach(remember);lsSet('wallet.trending',a);}}));
  side.push(cgGet(CG+'/global').then(function(j){const d=j&&j.data;
   if(d&&d.total_market_cap&&d.total_market_cap.usd){
    GLOBAL={cap:d.total_market_cap.usd,chg:d.market_cap_change_percentage_24h_usd||0};lsSet('wallet.global',GLOBAL);}}));
  side.push(jget('https://api.alternative.me/fng/?limit=1').then(function(j){const d=j&&j.data&&j.data[0];
   if(d&&!isNaN(parseInt(d.value,10))){FNG={v:parseInt(d.value,10),l:d.value_classification};lsSet('wallet.fng',FNG);}}));
  SLOWAT=Date.now();lsSet('wallet.slowAt',SLOWAT);
 }
 REFRESHING=Promise.all([main].concat(side.map(function(p){return p.catch(function(){});}))).then(function(){
  lsSet('wallet.prices',LIVE);REFRESHING=null;S.keepScroll=1;draw();});

function applyLive(t,l,unit){
 if(!l||typeof l.p!=='number')return t;
 t.p=l.p;t.c=l.c||0;
 if(l.cap!=null)t.cap=big(l.cap);
 if(l.rk!=null)t.rk=l.rk;
 if(l.sup!=null)t.sup=supply(l.sup,unit);
 t.max=(l.max!=null)?supply(l.max,unit):'\u221e';
 if(l.vol!=null)t.vol=big(l.vol);
 if(l.ath)t.ath=[pxs(l.ath),ago(l.athd),(((t.p-l.ath)/l.ath)*100).toFixed(2)+'%'];
 if(l.atl)t.atl=[pxs(l.atl),ago(l.atld),'+'+(((t.p-l.atl)/l.atl)*100).toFixed(2)+'%'];
 if(l.img)t.img=safeUrl(l.img);
 return t;}
function blankTok(s,n,i){return {s:s,n:n,u:s,i:i||'generic',p:0,c:0,cap:DASH,rk:DASH,sup:DASH,max:DASH,vol:DASH,
 ath:[DASH,DASH,DASH],atl:[DASH,DASH,DASH],earn:null};}
function tokBy(name){
 let t=PORT.concat(STABLE).find(function(x){return x.n===name||x.s===name;});
 if(t)t=Object.assign({},t);
 if(!t){const c=CATALOG.find(function(x){return x[1]===name||x[0]===name;});
  if(c){t=blankTok(c[0],c[1],c[2]);t.p=c[4];}}
 if(!t){const top=(TOP||[]).find(function(x){return x.n===name;});if(top)return tokById(top.id);}
 if(!t){let m=MKT.find(function(x){return x[0]===name;});
  if(!m){for(const k in SUB){const f=SUB[k].find(function(x){return x[0]===name;});if(f){m=f;break;}}}
  if(m){t=blankTok(m[0].split(' ')[0].toUpperCase().slice(0,5),m[0],m[1]);
   t.u='';t.p=parseFloat(m[4].replace(/[$,]/g,''))||0;t.c=m[5];t.cap=m[2];t.rk=m[3];}}
 if(!t)t=blankTok(String(name).toUpperCase().slice(0,6),name);
 const c=CATALOG.find(function(x){return x[1]===t.n||x[0]===t.s;});
 if(c){t.id=c[3];t.u=t.u||c[0];applyLive(t,LIVE[c[3]],c[0]);}
 t.held=HOLD[t.s]||0;
 return t;}
function tokById(id){
 const c=CATALOG.find(function(x){return x[3]===id;});
 if(c)return tokBy(c[1]);
 const k=COINS[id]||{},s=k.s||String(id).toUpperCase().slice(0,6);
 const t=blankTok(s,k.n||id,iconForId(id));
 t.id=id;t.img=safeUrl(k.img);t.p=k.p||0;t.c=k.c||0;
 applyLive(t,LIVE[id],s);t.held=0;
 return t;}

function chartKey(id,r){return id+'|'+r;}
function thin(pts,n){if(pts.length<=n)return pts;const out=[],step=(pts.length-1)/(n-1);
 for(let i=0;i<n;i++)out.push(pts[Math.round(i*step)]);return out;}
/* Chart sources, tried in order until one answers:
   Coinbase (keyless, high limits) -> CoinGecko (budgeted) -> CryptoCompare.
   Good results are cached on the device so charts show instantly and offline. */
const CHART_TTL={'1D':12e4,'1W':6e5,'1M':18e5,'1Y':216e5,'ALL':216e5};
const CHARTS=(function(){const c=lsGet('wallet.charts',{});return (c&&typeof c==='object'&&!Array.isArray(c))?c:{};})();
const INFLIGHT={};

function chartFresh(key,r){const c=CHARTS[key];return !!(c&&c.pts&&Date.now()-c.at<CHART_TTL[r]);}
function chartBackoff(key){const c=CHARTS[key];if(!c)return false;
 return (c.err&&Date.now()-c.at<8000)||(c.failAt&&Date.now()-c.failAt<30000);}
function saveCharts(){
 const keys=Object.keys(CHARTS).filter(function(k){return CHARTS[k]&&CHARTS[k].pts;})

const CB_SKIP={BNB:1,HYPE:1,TRX:1,STETH:1,XMR:1,TAO:1,XAUT:1,USDC:1,MNT:1,PUMP:1,LEO:1,OKB:1};
const CB={'1D':{g:300,n:288},'1W':{g:3600,n:168},'1M':{g:21600,n:120},'1Y':{g:86400,n:365},'ALL':{g:86400,n:2400}};
function cbCandles(sym,r){
 const s=String(sym||'').toUpperCase();
 if(!/^[A-Z0-9]{2,10}$/.test(s)||CB_SKIP[s])return Promise.reject(new Error('no product'));
 const cfg=CB[r],end=Date.now(),start=end-cfg.g*1000*cfg.n,win=cfg.g*1000*300,wins=[];
 for(let e=end;e>start;e-=win)wins.push([Math.max(start,e-win),e]);
 return Promise.all(wins.map(function(w,i){return delay(i*140).then(function(){
   return jget('https://api.exchange.coinbase.com/products/'+s+'-USD/candles?granularity='+cfg.g
    +'&start='+new Date(w[0]).toISOString()+'&end='+new Date(w[1]).toISOString());}).catch(function(){return [];});}))
 .then(function(parts){const m={};
  parts.forEach(function(a){if(Array.isArray(a))a.forEach(function(c){if(Array.isArray(c)&&typeof c[4]==='number'&&c[4]>0)m[c[0]]=c[4];});});
  const pts=Object.keys(m).map(Number).sort(function(a,b){return a-b;}).map(function(t){return [t*1000,m[t]];});
  if(pts.length<2)throw new Error('empty');return pts;});}

  .then(function(j){const pts=((j&&j.prices)||[]).filter(function(x){return Array.isArray(x)&&typeof x[1]==='number';});
   if(pts.length<2)throw new Error('empty');return pts;});};
 return get(RD[r]).catch(function(e){if(r==='ALL')return get('365');throw e;});}
const CC={'1D':'histominute?aggregate=5&limit=288','1W':'histohour?limit=168','1M':'histohour?aggregate=6&limit=120',
 '1Y':'histoday?limit=365','ALL':'histoday?allData=true'};
function ccHist(sym,r){

 return jget('https://min-api.cryptocompare.com/data/v2/'+CC[r]+'&fsym='+s+'&tsym=USD').then(function(j){
  const d=j&&j.Data&&j.Data.Data;if(!Array.isArray(d))throw new Error('shape');
  const pts=d.filter(function(x){return x&&x.close>0;}).map(function(x){return [x.time*1000,x.close];});
  if(pts.length<2)throw new Error('empty');return pts;});}

function agoShort(ms){const m=Math.round((Date.now()-ms)/60000);
 return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago';}
function interpY(xs,ys,x){for(let i=1;i<xs.length;i++)if(xs[i]>=x){const f=(x-xs[i-1])/((xs[i]-xs[i-1])||1);return ys[i-1]+(ys[i]-ys[i-1])*f;}return ys[ys.length-1];}

const CHARTCTX={};
/* Smooth display series: bucket-average the history down to ~64 nodes, soften
   it with a small binomial filter, keep the first and last real prices, then draw
   a monotone cubic through it (no overshoot, no sharp corners). Scrubbing still
   reads the real prices underneath. */
function smoothSeries(pts,n){
 const L=pts.length;if(L<3)return pts.slice();
 n=Math.min(n,L);const out=[];
 for(let i=0;i<n;i++){const a=Math.floor(i*L/n),b=Math.max(a+1,Math.floor((i+1)*L/n));
  let st=0,sv=0;for(let j=a;j<b;j++){st+=pts[j][0];sv+=pts[j][1];}out.push([st/(b-a),sv/(b-a)]);}
 for(let pass=0;pass<1;pass++){const v=out.map(function(p){return p[1];});
  for(let i=1;i<out.length-1;i++)out[i][1]=(v[i-1]+2*v[i]+v[i+1])/4;}
 out[0]=[pts[0][0],pts[0][1]];out[out.length-1]=[pts[L-1][0],pts[L-1][1]];
 return out;}
function monoPath(xs,ys){
 const n=xs.length;if(n<2)return '';
 const d=[],m=new Array(n);
 for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/((xs[i+1]-xs[i])||1e-6));
 m[0]=d[0];m[n-1]=d[n-2];
 for(let i=1;i<n-1;i++)m[i]=(d[i-1]*d[i]<=0)?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=0;m[i+1]=0;continue;}
  const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);m[i]=k*a*d[i];m[i+1]=k*b*d[i];}}
 let p='M'+xs[0].toFixed(1)+' '+ys[0].toFixed(1);
 for(let i=0;i<n-1;i++){const h=(xs[i+1]-xs[i])/3;
  p+='C'+(xs[i]+h).toFixed(1)+' '+(ys[i]+m[i]*h).toFixed(1)+','+(xs[i+1]-h).toFixed(1)+' '+(ys[i+1]-m[i+1]*h).toFixed(1)+','+xs[i+1].toFixed(1)+' '+ys[i+1].toFixed(1);}
 return p;}
function lineChart(boxId,pts,opt){
 const W=361,H=220,TOPP=34,BOT=16;
 const sm=smoothSeries(pts,64);
 let lo=Infinity,hi=-Infinity,li=0,hiI=0,rlo=Infinity,rhi=-Infinity;
 sm.forEach(function(p,i){if(p[1]<lo){lo=p[1];li=i;}if(p[1]>hi){hi=p[1];hiI=i;}});
 pts.forEach(function(p){if(p[1]<rlo)rlo=p[1];if(p[1]>rhi)rhi=p[1];});
 const span=(hi-lo)||Math.abs(hi)*0.01||1;
 const t0=pts[0][0],t1=pts[pts.length-1][0],ts=(t1-t0)||1;
 const X=function(t){return (t-t0)/ts*W;},Y=function(v){return TOPP+(1-(v-lo)/span)*(H-TOPP-BOT);};
 const sx=sm.map(function(p){return X(p[0]);}),sy=sm.map(function(p){return Y(p[1]);});
 const d=monoPath(sx,sy);
 /* scrub targets: every real price point, with its dot placed on the drawn curve */
 const xs=pts.map(function(p){return X(p[0]);}),ys=xs.map(function(x){return interpY(sx,sy,x);});
 const col=opt.color,gid='lg'+boxId;
 let marks='';
 (opt.marks||[]).forEach(function(m){if(m.t<t0-6e4||m.t>t1+6e5)return;
  const x=Math.max(0,Math.min(W,(m.t-t0)/ts*W)),y=interpY(sx,sy,x);
  marks+='<i class="mk '+m.type+'" style="left:'+Math.min(98.2,Math.max(1.8,x/W*100)).toFixed(2)+'%;top:'+y.toFixed(1)+'px"></i>';});
 CHARTCTX[boxId]={pts:pts,xs:xs,ys:ys,W:W,H:H};
 const flag=function(i,below,val){const x=Math.min(87,Math.max(13,sx[i]/W*100)).toFixed(1),y=sy[i];
  return below
   ?'<div class="cflag" style="left:'+x+'%;top:'+Math.min(H-18,y+6).toFixed(0)+'px"><i style="border-bottom:5px solid #fff;margin:0 auto 2px"></i>'+opt.fmt(val)+'</div>'
   :'<div class="cflag" style="left:'+x+'%;top:'+Math.max(0,y-26).toFixed(0)+'px">'+opt.fmt(val)+'<i style="border-top:5px solid #fff"></i></div>';};
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+col+'" stop-opacity=".26"/><stop offset=".75" stop-color="'+col+'" stop-opacity=".05"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
  +'<path d="'+d+' L'+W+' '+H+' L0 '+H+' Z" fill="url(#'+gid+')"/>'
  +'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'
  +marks+(opt.flags===false?'':flag(hiI,false,rhi)+flag(li,true,rlo))
  +'<div class="scr-l"></div><div class="scr-d" style="background:'+col+'"></div>';}

function wireScrub(boxId,onMove,onEnd){
 const box=document.getElementById(boxId),ctx=CHARTCTX[boxId];
 if(!box||!ctx||box._wired)return;box._wired=1;
 const L=box.querySelector('.scr-l'),D=box.querySelector('.scr-d');
 let last=-1,down=false,tick=0;
 function idx(e){const r=box.getBoundingClientRect(),w=box.offsetWidth||r.width;
  const u=toLocal(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
  const tx=Math.max(0,Math.min(w,u[0]+w/2))/w*ctx.W;
  let b=0;for(let i=1;i<ctx.xs.length;i++){if(Math.abs(ctx.xs[i]-tx)<Math.abs(ctx.xs[b]-tx))b=i;}return b;}
 function show(i){if(i===last)return;last=i;
  const now=Date.now();if(now-tick>70){haptic('selection');tick=now;}
  const px=(ctx.xs[i]/ctx.W*100).toFixed(2)+'%';
  L.style.left=px;D.style.left=px;D.style.top=(ctx.ys[i]/ctx.H*box.clientHeight).toFixed(1)+'px';
  box.classList.add('scrub');onMove(ctx.pts[i]);}
 function end(){if(!down)return;down=false;last=-1;box.classList.remove('scrub');onEnd();}
 box.addEventListener('pointerdown',function(e){down=true;try{box.setPointerCapture(e.pointerId);}catch(_){}show(idx(e));});
 box.addEventListener('pointermove',function(e){if(down)show(idx(e));});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){box.addEventListener(ev,end);});}

const PAL=['#a48afb','#5ac8fa','#ff9f0a','#30d158','#ff375f','#64d2ff','#ffd60a','#bf5af2'];
function nearPrice(pts,T){let lo=0,hi=pts.length-1;
 if(T<=pts[0][0])return pts[0][1];if(T>=pts[hi][0])return pts[hi][1];
 while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m][0]<=T)lo=m;else hi=m;}
 return (T-pts[lo][0]<pts[hi][0]-T)?pts[lo][1]:pts[hi][1];}
function pfSeries(r){
 const held=heldSyms();if(!held.length)return {err:1};
 const ch=held.map(function(s){return {s:s,k:CHARTS[ckey({id:BYSYM[s][3],s:s},r)]};});
 if(ch.some(function(x){return !x.k||(!x.k.pts&&!x.k.err);}))return {loading:1};
 const ok=ch.filter(function(x){return x.k.pts;});
 if(!ok.length)return {err:1};
 const axis=ok.reduce(function(a,b){return b.k.pts.length>a.k.pts.length?b:a;}).k.pts.map(function(p){return p[0];});
 const pts=axis.map(function(T){let v=0;
  ch.forEach(function(x){v+=(HOLD[x.s]||0)*(x.k.pts?nearPrice(x.k.pts,T):priceOf(x.s));});return [T,v];});
 const now=Date.now();if(now-pts[pts.length-1][0]>6e4)pts.push([now,portfolio().now]);
 else pts[pts.length-1][1]=portfolio().now;
 return {pts:pts};}

function openAdd(mode,sym){

 if(S.add&&(S.add.mode==='swapf'||S.add.mode==='swapt')){
  if(S.add.mode==='swapf'){if(S.sw.t===s)S.sw.t=S.sw.f;S.sw.f=s;}else{if(S.sw.f===s)S.sw.f=S.sw.t;S.sw.t=s;}
  S.sw.v=S.add.mode==='swapf'?'':S.sw.v;haptic('selection');closeAdd();return;}
 if(S.add&&S.add.step==='pick'){toAmt(s);haptic('light');drawOv();}else openAdd('edit',s);}

 if(el)el.classList.remove('on');
 setTimeout(function(){S.add=null;ADDOPEN=false;drawOv();S.keepScroll=1;draw();},280);}
function key(k){const a=S.add;if(!a||a.step!=='amt')return;
 const f=a.f==='px'?'pv':'v';let s=a[f];
 if(k==='<')s=s.slice(0,-1);
 else if(k==='.'){if(s.indexOf('.')<0)s=(s||'0')+'.';}
 else s=(s==='0')?k:(s+k);
 if(s.length>16)s=s.slice(0,16);
 a[f]=s;haptic('light');drawOv();}
function maxAmt(){const a=S.add;if(!a||!a.sym)return;a.v=String(HOLD[a.sym]||0);a.f='amt';haptic('light');drawOv();}

function saveHold(){const a=S.add;if(!a||a.step!=='amt')return;
 if(a.f==='px'){a.f='amt';drawOv();return;}
 const n=parseFloat(a.v);if(!isFinite(n)||n<=0)return;
 const old=HOLD[a.sym]||0,px=parseFloat(a.pv)/CUR().r;
 if(a.mode==='send'){
  if(n>old+1e-12){haptic('warning');return;}
  const left=old-n;if(left<1e-12)delete HOLD[a.sym];else HOLD[a.sym]=left;
  logOp(a.sym,'out',n,'Sent');}
 else if(a.mode==='edit'){
  HOLD[a.sym]=n;const d=n-old;
  if(d>1e-12)logOp(a.sym,'in',d,'Received',px);else if(d<-1e-12)logOp(a.sym,'out',-d,'Sent');}
 else{HOLD[a.sym]=old+n;logOp(a.sym,'in',n,MODE[a.mode].label,px);}
 lsSet('wallet.holdings',HOLD);haptic('success');
 if(S.sub==='detail'&&S.token&&S.token.s===a.sym)S.token=tokBy(S.token.n);
 closeAdd();}

 closeAdd();}

 if(a.step==='pick'){
  return '<div class="fs'+cls+'"><div class="hd"><button class="ib" onclick="closeAdd()">'+XI+'</button>'
  +'<div class="t">'+M.pick+'</div></div>'
  +'<div class="sfield">'+SRCH+'<input class="txt" placeholder="Search asset" autocomplete="off" autocapitalize="off" spellcheck="false" value="'
   +esc(a.q||'')+'" oninput="S.add.q=this.value;reList()"></div>'
  +'<div class="bd" id="picklist" style="margin-top:8px">'+pickRows(pickList())+'</div></div>';}
 const s=a.sym,live=priceOf(s),cu=CUR(),pxEntry=parseFloat(a.pv)/cu.r,px=(pxEntry>0?pxEntry:live);
 const n=parseFloat(a.v||'0')||0,held=HOLD[s]||0,editing=a.mode==='edit';
 const over=a.mode==='send'&&n>held+1e-12;
 const canPx=a.mode==='buy'||a.mode==='receive'||(editing&&n>held);
 let big,sub,err='';
 if(a.f==='px'){
  big='<span class="u">'+esc(cu.sym.trim())+'</span>'+(a.pv===''?'<span class="ph">'+(live*cu.r).toFixed(live*cu.r<1?4:(cu.d||0))+'</span>':esc(a.pv));
  sub='Price per '+s+' \u00b7 market '+pxs(live);
 }else{

  sub=money(n*(a.mode==='send'?live:px))+(canPx?'<button class="pxbtn" onclick="togglePx()">at '+pxs(px)+(pxEntry>0?'':'')+' \u00b7 Edit price</button>':'');
  if(a.v!==''&&!(n>0))err='Enter an amount greater than zero';
  if(over)err='You have '+qty(held)+' '+s;
 }
 const ok=a.f==='px'?true:(n>0&&!over);
 return '<div class="fs'+cls+'"><div class="hd"><button class="ib" onclick="backPick()">'+BACK+'</button>'
 +'<div class="t">'+(a.f==='px'?'Entry price':(editing?M.amt:M.amt+s))+'</div></div>'
 +'<div class="aewrap"><div class="ae">'
 +'<div class="tk">'+ic(iconOf(s),28,imgOf(s))+nameOf(s)+(a.mode==='send'?'<span class="avail">'+qty(held)+' available</span>':'')+'</div>'
 +'<div class="big">'+big+'</div>'
 +'<div class="usd">'+sub+'</div>'
 +'<div class="err">'+err+'</div>'
 +(a.mode==='send'&&a.f==='amt'?'<button class="maxchip" onclick="maxAmt()">Max</button>':'')
 +(M.note&&a.f==='amt'?'<div class="note">'+M.note+'</div>':'')+'</div>'
 +'<div class="act">'+(editing&&a.f==='amt'?'<button class="del" onclick="delHold()" aria-label="Remove from wallet">'+TRASH+'</button>':'')
 +'<button class="save" onclick="saveHold()"'+(ok?'':' disabled')+'>'+(a.f==='px'?'Done':M.btn)+'</button></div>'
 +'<div class="pad">'+keypad()+'</div></div></div>';}

   PULL TO REFRESH
   ============================================================ */
/* PORTRAIT LOCK · web pages can't lock orientation on iPhone, so when a phone
   turns sideways the app counter-rotates and stays portrait against the device,
   the same way a portrait-only native app behaves. */
let ROT=0;
function toLocal(dx,dy){if(!ROT)return [dx,dy];
 const a=ROT*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
 return [Math.round((dx*c+dy*s)*1000)/1000,Math.round((-dx*s+dy*c)*1000)/1000];}
/* FULL-SCREEN HEIGHT · as a home-screen web app with a translucent status bar,
   iOS reports the viewport ~59pt short, leaving a black band at the bottom.
   In that mode (and inside the native app) size the page to the physical screen. */
function isFullApp(){
 try{if(window.navigator.standalone===true)return true;}catch(e){}
 try{if(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches)return true;}catch(e){}
 try{return !!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.net);}catch(e){return false;}}
function screenDims(){
 let W=window.innerWidth,H=window.innerHeight;
 const touch=window.matchMedia('(hover:none) and (pointer:coarse)').matches;
 if(touch&&isFullApp()&&screen&&screen.width&&screen.height){
  const a=Math.max(screen.width,screen.height),b=Math.min(screen.width,screen.height);
  if(W>H){W=Math.max(W,a);H=Math.max(H,b);}else{W=Math.max(W,b);H=Math.max(H,a);}
  document.documentElement.classList.add('full');
  document.documentElement.style.setProperty('--appH',H+'px');}
 return [W,H];}
function orient(ph){
 const d=screenDims(),W=d[0],H=d[1];
 const touch=window.matchMedia('(hover:none) and (pointer:coarse)').matches;
 const land=touch&&W>H&&Math.min(W,H)<520;
 let rot=0;
 if(land){const a=(typeof window.orientation==='number')?window.orientation
   :((screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:90);
  rot=(a===-90||a===270)?90:-90;}
 const was=ROT;ROT=rot;
 document.documentElement.classList.toggle('rot',!!rot);
 if(rot){ph.style.width=H+'px';ph.style.height=W+'px';ph.style.transform='translate(-50%,-50%) rotate('+rot+'deg)';}
 else{ph.style.width='';ph.style.height='';ph.style.transform='';}
 if(was!==rot){const v=document.getElementById('view');if(v)v.scrollTop=v.scrollTop;}}

/* Pull down at the top: the page stretches with iOS-style rubber-band
   resistance while the header and gradient stay put, then springs back.
   Past the threshold it refreshes quietly (a haptic tick, no spinner). */
function wirePTR(){
 const v=document.getElementById('view');if(!v||v._ptr)return;v._ptr=1;
 let y0=null,x0=0,armed=false,active=false,canRefresh=false,st=0;
 function setPull(px,spring){
  clearTimeout(st);
  v.classList.toggle('springing',!!spring);
  v.style.setProperty('--pull',px.toFixed(1)+'px');
  if(px>0.5)v.classList.add('pulling');
  if(spring)st=setTimeout(function(){v.classList.remove('springing','pulling');v.style.removeProperty('--pull');},560);}
 v.addEventListener('touchstart',function(e){
  if(S.add||e.touches.length!==1||v.scrollTop>0){y0=null;return;}
  y0=e.touches[0].clientY;x0=e.touches[0].clientX;active=false;armed=false;
  canRefresh=(!S.sub&&S.tab==='home')||S.sub==='analytics';},{passive:true});
 v.addEventListener('touchmove',function(e){
  if(y0==null)return;
  const lv=toLocal(e.touches[0].clientX-x0,e.touches[0].clientY-y0),dx=lv[0],dy=lv[1];
  if(!active){
   if(Math.abs(dy)<4&&Math.abs(dx)<4)return;
   if(dy<=0||v.scrollTop>0||Math.abs(dx)>Math.abs(dy)){y0=null;return;}
   active=true;}
  if(e.cancelable)e.preventDefault();
  const H=v.clientHeight||800,d=Math.max(0,dy);
  const pull=(1-1/(d*0.55/H+1))*H;                 /* UIScrollView rubber-band curve */
  setPull(pull,false);
  if(canRefresh&&!armed&&pull>78){armed=true;haptic('medium');}
  else if(armed&&pull<64)armed=false;},{passive:false});
 function end(){
  if(!active){y0=null;return;}
  y0=null;active=false;setPull(0,true);
  if(armed){armed=false;refresh(true);}}
 v.addEventListener('touchend',end);v.addEventListener('touchcancel',end);}

function draw(){
 const v=document.getElementById('view');if(!v)return;
 const sc=v.scrollTop;let html;
 try{nav();
 if(S.sub==='detail')html=vDetail();
 else if(S.sub==='analytics')html=vAnalytics();
 else if(S.sub==='discover')html=vDiscover();
 else if(S.sub==='account')html=vAccount();
 else if(S.sub==='txns')html=vTxns();
 else if(S.sub==='search')html=vSearch();
 else if(S.sub==='settings')html=vSettings();
 else if(S.tab==='home')html=vHome();
 else if(S.tab==='market')html=vMarket();
 else if(S.tab==='swap')html=vSwap();
 else if(S.tab==='earn')html=vEarn();
 else html=vCard();
 }catch(err){
  try{console.error('draw failed',err);}catch(_){}
  html='<div class="tb"><button class="ib" onclick="S.sub=null;S.tab=\'home\';S.token=null;draw()">'+BACK+'</button></div>'
   +'<div class="empty"><h3>Something went wrong</h3><p>'+esc(String(err&&err.message||err))+'</p>'
   +'<button class="pillbtn" onclick="S.sub=null;S.tab=\'home\';S.token=null;draw()">Back to Home</button></div>';}
 v.innerHTML='<div class="topfade"></div><div class="sbspace"></div>'+html;
 const dw=document.getElementById('dockwrap'),dk=v.querySelector('.dock');
 if(dw){dw.innerHTML='';if(dk)dw.appendChild(dk);}
 if(S.keepScroll){v.scrollTop=sc;S.keepScroll=0;}
 else{v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade');v.scrollTop=0;}
 v.classList.toggle('scrolled',v.scrollTop>6);
 drawOv();mount();}
function mount(){
 paintMeshes();
 if(S.sub==='detail'&&S.token){const t=S.token;ensureStats(t);
  if(chartable(t)){const key=ckey(t,S.range),k=CHARTS[key];
   if(!INFLIGHT[key]&&!chartFresh(key,S.range)&&!chartBackoff(key))
    loadChart(t,S.range).then(function(){if(S.sub==='detail'&&S.token&&ckey(S.token,S.range)===key){S.keepScroll=1;draw();}});
   if(k&&k.pts)wireDetailScrub();}}
 if(S.sub==='analytics'){const r=S.arange;
  const toks=heldSyms().map(function(x){return {id:BYSYM[x][3],s:x};});
  const need=toks.filter(function(t){const key=ckey(t,r);return !INFLIGHT[key]&&!chartFresh(key,r)&&!chartBackoff(key);});
  if(need.length)Promise.all(need.map(function(t){return loadChart(t,r);}))
   .then(function(){if(S.sub==='analytics'&&S.arange===r){S.keepScroll=1;draw();}});
  if(pfSeries(r).pts)wirePfScrub();}
 if(S.sub==='search'&&!S.keepFocus){const q=document.getElementById('sq');if(q&&!S.q)try{q.focus({preventScroll:true});}catch(e){}}
 wirePTR();}

/* ============================================================
   SWAP · converts balances you entered at live market prices.
   Logged as two history entries so P&L stays right. No funds move.
   ============================================================ */
S.sw={f:null,t:null,v:''};S.swq=0;S.swdone=null;
function swCalc(){
 const f=S.sw.f,t=S.sw.t,n=parseFloat(S.sw.v)||0;
 const pf=f?priceOf(f):0,pt=t?priceOf(t):0,held=f?(HOLD[f]||0):0;
 const recv=(f&&t&&f!==t&&n>0&&pf>0&&pt>0)?n*pf/pt:0;
 let err='';
 if(f&&n>held+1e-12)err='You have '+qty(held)+' '+f;
 else if(S.sw.v!==''&&S.sw.v!=='.'&&!(n>0))err='Enter an amount greater than zero';
 return {f:f,t:t,n:n,pf:pf,pt:pt,held:held,recv:recv,usd:n*pf,err:err,ok:!!(recv>0&&!err)};}
function swPick(sym){
 if(!sym)return '<div class="pick">Choose asset '+PICKC+'</div>';
 return '<div class="pick sel">'+ic(iconOf(sym),22,imgOf(sym))+esc(sym)+' '+PICKC+'</div>';}
function swRateTxt(c){
 if(!(c.f&&c.t&&c.pf>0&&c.pt>0&&c.f!==c.t))return '';
 return (c.recv?money(c.recv*c.pt)+' \u00b7 ':'')+'1 '+c.f+' \u2248 '+qty(c.pf/c.pt)+' '+c.t;}
function swDefaults(){
 const held=heldSyms();
 if(S.sw.f&&!BYSYM[S.sw.f])S.sw.f=null;
 if(!S.sw.f&&held.length)S.sw.f=held[0];
 if(!S.sw.t&&S.sw.f)S.sw.t=['ETH','BTC','USDT'].find(function(x){return x!==S.sw.f;});}
function vSwap(){
 swDefaults();
 const c=swCalc();
 return miniHdr(0)+'<div class="swp">'
 +'<div class="sbox a"><div class="lb">Send'+(c.f?'<span class="bal">Balance: '+(HIDE?'\u2022\u2022\u2022':qty(c.held))+' '+esc(c.f)+'</span>':'')+'</div>'
 +'<div class="rowx"><input class="amt" id="swIn" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0" value="'+esc(S.sw.v)+'" oninput="swInput(this)">'
 +'<div class="pk2" onclick="openAdd(\'swapf\')">'+swPick(c.f)+'</div></div>'
 +'<div class="fiat"><span id="swFiat" class="'+(c.err?'bad':'')+'">'+(c.err||money(c.usd))+'</span>'
 +(c.f&&c.held>0?'<button class="maxs" onclick="swMax()">Use max</button>':'')+'</div></div>'
 +'<div class="flip" onclick="swFlip()" aria-label="Switch assets">'+UPDN+'</div>'
 +'<div class="sbox b"><div class="lb">Receive</div>'
 +'<div class="rowx"><div class="amt'+(c.recv?' on':'')+'" id="swOut">'+(c.recv?qty(c.recv):'0')+'</div>'
 +'<div class="pk2" onclick="openAdd(\'swapt\')">'+swPick(c.t)+'</div></div>'
 +'<div class="fiat" id="swRate">'+swRateTxt(c)+'</div></div></div>'
 +'<button class="quotes'+(c.ok?' on':'')+'" id="swGo" onclick="swQuotes()">View quotes</button>';}
function swRefresh(){
 const c=swCalc(),g=function(i){return document.getElementById(i);};
 if(g('swFiat')){g('swFiat').textContent=c.err||money(c.usd);g('swFiat').className=c.err?'bad':'';}
 if(g('swOut')){g('swOut').textContent=c.recv?qty(c.recv):'0';g('swOut').className='amt'+(c.recv?' on':'');}
 if(g('swRate'))g('swRate').textContent=swRateTxt(c);
 if(g('swGo'))g('swGo').className='quotes'+(c.ok?' on':'');}
function swInput(el){
 let v=String(el.value||'').replace(',','.').replace(/[^0-9.]/g,'');
 const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');
 if(v.length>18)v=v.slice(0,18);
 if(v!==el.value)el.value=v;
 S.sw.v=v;swRefresh();}
function swMax(){if(!S.sw.f)return;S.sw.v=String(parseFloat((HOLD[S.sw.f]||0).toFixed(10)));haptic('selection');
 const el=document.getElementById('swIn');if(el)el.value=S.sw.v;swRefresh();}
function swFlip(){const f=S.sw.f;S.sw.f=S.sw.t;S.sw.t=f;haptic('selection');S.keepScroll=1;draw();}
function swapWith(sym){
 if((HOLD[sym]||0)>0){if(S.sw.t===sym)S.sw.t=S.sw.f;S.sw.f=sym;}
 else{if(S.sw.f===sym)S.sw.f=S.sw.t;S.sw.t=sym;}
 S.sw.v='';go('swap');}
function swQuotes(){
 const c=swCalc();
 if(!c.f){openAdd('swapf');return;}
 if(!c.t){openAdd('swapt');return;}
 if(!c.ok){haptic('warning');const el=document.getElementById('swIn');if(el)el.focus();return;}
 try{document.activeElement&&document.activeElement.blur();}catch(e){}
 S.swq=1;haptic('light');drawOv();}
function swConfirm(){
 const c=swCalc();if(!c.ok){S.swq=0;drawOv();return;}
 const left=c.held-c.n;
 if(left<1e-12)delete HOLD[c.f];else HOLD[c.f]=left;
 HOLD[c.t]=(HOLD[c.t]||0)+c.recv;
 logOp(c.f,'out',c.n,'Swapped',c.pf);
 logOp(c.t,'in',c.recv,'Swapped for',c.pt);
 lsSet('wallet.holdings',HOLD);
 S.swq=0;S.swdone={f:c.f,t:c.t,n:c.n,recv:c.recv,pf:c.pf,pt:c.pt};S.sw.v='';
 haptic('success');S.keepScroll=1;draw();}
function swSheets(){
 if(S.swq){const c=swCalc();if(!c.ok){S.swq=0;return '';}
  const upd=LAST?('Prices updated '+agoShort(LAST)):'Using saved prices';
  return smallSheet('Select quote','<div class="qcard">'
   +'<div class="qh"><span>Market rate</span><span class="qtag">Floating</span></div>'
   +'<div class="qr"><span>Rate</span><b>1 '+c.f+' \u2248 '+qty(c.pf/c.pt)+' '+c.t+'</b></div>'
   +'<div class="qr"><span>You send</span><b>'+qty(c.n)+' '+c.f+'</b></div>'
   +'<div class="qr"><span>You receive</span><b>'+qty(c.recv)+' '+c.t+'</b></div>'
   +'<div class="qr"><span>Value</span><b>'+money(c.usd)+'</b></div></div>'
   +'<div class="note2">'+upd+'. The swap is recorded in your history at this rate. No funds move and no fees are charged.</div>'
   +'<div class="act"><button class="save" onclick="swConfirm()">Swap</button></div>');}
 if(S.swdone){const d=S.swdone;
  return smallSheet('Swap '+esc(d.f)+' \u2192 '+esc(d.t),'<div class="qcard">'
   +'<div class="qr"><span>Status</span><b style="color:var(--green)">Completed</b></div>'
   +'<div class="qr"><span>Sent</span><b>'+qty(d.n)+' '+esc(d.f)+'</b></div>'
   +'<div class="qr"><span>Received</span><b>'+qty(d.recv)+' '+esc(d.t)+'</b></div>'
   +'<div class="qr"><span>Rate</span><b>1 '+esc(d.f)+' \u2248 '+qty(d.pf/d.pt)+' '+esc(d.t)+'</b></div></div>'
   +'<div class="act"><button class="ghost" onclick="S.swdone=null;drawOv();openTxns()">View history</button>'
   +'<button class="save" onclick="S.swdone=null;drawOv()">Done</button></div>');}
