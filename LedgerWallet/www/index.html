let DLCAP=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(function(d){DLCAP=d||null;},function(){});}catch(e){}
function exportData(){
 const d=new Date(),p=function(n){return (n<10?'0':'')+n;};
 const name='wallet-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
 const data={app:'wallet',version:1,exported:d.toISOString(),holdings:HOLD,ops:OPS,
  settings:Object.assign({},SET,{lock:null}),favs:FAVS,hide:HIDE};
 const text=JSON.stringify(data,null,1);
 try{window.webkit.messageHandlers.share.postMessage({name:name,text:text});haptic('success');return;}catch(e){}
 /* inside the Claude artifact viewer, files go through its downloads capability */
 if(DLCAP){DLCAP.save({filename:name,data:text}).then(function(){haptic('success');toast('Backup saved');},
   function(e){const c=e&&e.code;if(c!=='declined')toast(c==='rate_limited'?'A save is already open':'Couldn\u2019t save the file here');});return;}
 try{const b=new Blob([text],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);haptic('success');toast('Backup saved');}
 catch(e){toast('Couldn\u2019t save the file here');}}
function importData(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=function(){const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=function(){const v=parseBackup(String(r.result||''));
   if(!v){haptic('warning');toast('That file isn\u2019t a wallet backup');return;}
   S.imp=v;askConfirm('import');};r.readAsText(f);};
 inp.click();}
function parseBackup(text){
 let j;try{j=JSON.parse(text);}catch(e){return null;}
 if(!j||typeof j!=='object'||!j.holdings||typeof j.holdings!=='object')return null;
 const h={};Object.keys(j.holdings).forEach(function(s){const n=+j.holdings[s];if(BYSYM[s]&&isFinite(n)&&n>0)h[s]=n;});
 const ops=(Array.isArray(j.ops)?j.ops:[]).filter(function(o){return o&&BYSYM[o.s]&&(o.type==='in'||o.type==='out')
  &&isFinite(+o.amt)&&+o.amt>0&&isFinite(+o.t)&&isFinite(+o.px)&&+o.px>=0;})
  .map(function(o){return {id:String(o.id||('i'+o.t+Math.random().toString(36).slice(2,6))).slice(0,40),t:+o.t,s:o.s,type:o.type,
   label:String(o.label||'').slice(0,30),amt:+o.amt,px:+o.px};});
 const st={};const src=(j.settings&&typeof j.settings==='object')?j.settings:{};
 if(CURS[src.cur])st.cur=src.cur;if(DATEF[src.date])st.date=src.date;
 if(src.market==='eastern'||src.market==='western')st.market=src.market;
 ['recos','haptics'].forEach(function(k){if(typeof src[k]==='boolean')st[k]=src[k];});
 const favs=(Array.isArray(j.favs)?j.favs:[]).filter(function(x){return typeof x==='string'&&/^[a-z0-9-]{1,60}$/.test(x);});
 return {holdings:h,ops:ops,settings:st,favs:favs,hide:j.hide===true};}
function applyImport(){const v=S.imp;S.imp=null;if(!v)return;
 HOLD=v.holdings;OPS=v.ops.sort(function(a,b){return a.t-b.t;});
 lsSet('wallet.holdings',HOLD);saveOps();
 SET=Object.assign({},SET_DEF,v.settings,{lock:SET.lock});saveSet();applyMarketClass();
 FAVS=v.favs;lsSet('wallet.favs',FAVS);HIDE=v.hide;lsSet('wallet.hide',HIDE);
 /* keep history consistent with balances, as on first launch */
 const q={};OPS.forEach(function(o){q[o.s]=(q[o.s]||0)+(o.type==='in'?o.amt:-o.amt);});
 Object.keys(HOLD).forEach(function(s){const d=HOLD[s]-(q[s]||0);
  if(Math.abs(d)>1e-12)OPS.push({id:'r'+s+Date.now().toString(36),t:Date.now(),s:s,type:d>0?'in':'out',label:d>0?'Received':'Sent',amt:Math.abs(d),px:priceOf(s)});});
 saveOps();
 if(SET.cur!=='USD'&&!curRate())loadFx();
 haptic('success');toast('Data imported');S.sub=null;S.set=null;S.tab='home';draw();}

/* ============================================================
   APP LOCK · 4-digit passcode screen. It keeps casual eyes out of
   the app; it is not encryption (data sits in this device's storage).
   ============================================================ */
let LK=null,HIDDENAT=0;
function lockHash(p){let h=2166136261;const s='wallet-lock:'+p;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
function showLock(mode){LK={mode:mode,v:'',first:'',err:'',forgot:false};renderLock();}
function toggleLock(){showLock(SET.lock?'off':'set');}
function cancelLock(){LK=null;renderLock();}
function renderLock(){
 let el=document.getElementById('lock');
 if(!LK){if(el)el.remove();return;}
 if(!el){el=document.createElement('div');el.id='lock';const ph=document.getElementById('phone');if(!ph)return;ph.appendChild(el);}
 if(LK.forgot){
  el.innerHTML='<div class="lk"><div class="lkt">Forgot passcode?</div>'
  +'<div class="lks" style="max-width:290px">The only way in is to reset the wallet. That erases all balances, transaction history and settings stored in this app on this device.</div>'
  +'<div class="act" style="width:100%;margin-top:26px"><button class="ghost" onclick="LK.forgot=false;renderLock()">Cancel</button>'
  +'<button class="save danger" onclick="resetWallet()">Reset Wallet</button></div></div>';return;}
 const T={unlock:'Enter passcode',set:'Create a passcode',confirm:'Confirm passcode',off:'Enter passcode'}[LK.mode];
 const sub={unlock:'Unlock your wallet',set:'Choose 4 digits you\u2019ll remember.',confirm:'Enter the same 4 digits again.',off:'Enter your passcode to turn off app lock.'}[LK.mode];
 el.innerHTML='<div class="lk">'+(LK.mode!=='unlock'?'<button class="ib lkx" onclick="cancelLock()" aria-label="Cancel">'+XI+'</button>':'')
 +'<div class="lkic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2.4"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/></svg></div>'
 +'<div class="lkt">'+T+'</div><div class="lks'+(LK.err?' bad':'')+'">'+(LK.err||sub)+'</div>'
 +'<div class="lkd'+(LK.err?' shake':'')+'">'+[0,1,2,3].map(function(i){return '<i class="'+(i<LK.v.length?'on':'')+'"></i>';}).join('')+'</div>'
 +'<div class="lkp">'+[['1','2','3'],['4','5','6'],['7','8','9'],['','0','<']].map(function(r){
   return '<div class="pr">'+r.map(function(k){return k===''?'<div class="pk fn"></div>'
    :'<div class="pk'+(k==='<'?' fn':'')+'" onclick="lockKey(\''+k+'\')">'+(k==='<'?DELK:k)+'</div>';}).join('')+'</div>';}).join('')+'</div>'
 +(LK.mode==='unlock'?'<button class="lkf" onclick="LK.forgot=true;renderLock()">Forgot passcode?</button>':'<div style="height:44px"></div>')
 +'</div>';}
function lockKey(k){if(!LK)return;
 if(k==='<')LK.v=LK.v.slice(0,-1);else if(LK.v.length<4)LK.v+=k;
 LK.err='';haptic('light');renderLock();
 if(LK.v.length===4)setTimeout(lockDone,140);}
function lockDone(){if(!LK||LK.v.length!==4)return;const v=LK.v;
 if(LK.mode==='set'){LK.first=v;LK.mode='confirm';LK.v='';renderLock();return;}
 if(LK.mode==='confirm'){
  if(v===LK.first){SET.lock=lockHash(v);saveSet();LK=null;renderLock();haptic('success');toast('App lock is on');S.keepScroll=1;draw();}
  else{LK.mode='set';LK.v='';LK.first='';LK.err='Passcodes didn\u2019t match. Try again.';haptic('warning');renderLock();}
  return;}
 if(lockHash(v)===SET.lock){
  if(LK.mode==='off'){SET.lock=null;saveSet();toast('App lock is off');}
  LK=null;renderLock();haptic('success');S.keepScroll=1;draw();}
 else{LK.v='';LK.err='Wrong passcode';haptic('warning');renderLock();}}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){HIDDENAT=Date.now();return;}
 if(SET.lock&&(!LK||LK.mode!=='unlock')&&HIDDENAT&&Date.now()-HIDDENAT>30000)showLock('unlock');});

S.dq='';
function provRows(){const q=(S.dq||'').toLowerCase();
 const list=PROV.filter(function(p){return !q||p.n.toLowerCase().indexOf(q)>=0||String(p.u||p.sub||'').toLowerCase().indexOf(q)>=0;});
 if(!list.length)return '<div class="empty" style="padding:60px 30px"><p>No providers match \u201c'+esc(S.dq)+'\u201d</p></div>';
 return list.map(function(p){const url=p.u||'https://www.ledger.com/recover';
  return '<div class="pv '+(p.hl?'hl':'')+'" onclick="openExt(\''+url+'\')">'
  +'<div class="pi" style="background:'+p.bg+';color:'+p.lc+'">'+p.l+'</div>'
  +'<div style="flex:1;min-width:0"><div class="pn">'+p.n+'</div><div class="pu">'+(p.sub||p.u)+'</div></div></div>';}).join('');}
function vDiscover(){
 const cats=['ALL','LEDGER','DEFI','STAKE/EARN/MANAGE','SERVICES'];
 return '<div class="tb"><button class="ib" onclick="back()">'+BACK+'</button></div>'
 +'<div style="padding:2px var(--m) 0;font-family:var(--sysdisp);font-size:30px;font-weight:700;letter-spacing:-.9px">Discover</div>'
 +'<div class="sfield">'+SRCH+'<input class="txt" placeholder="Search for a provider..." autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(S.dq)+'" oninput="S.dq=this.value;document.getElementById(\'plist\').innerHTML=provRows()"></div>'
 +'<div style="padding:22px var(--m) 0;font-family:var(--sysdisp);font-size:26px;font-weight:700;letter-spacing:-.8px">Categories</div>'
 +'<div class="utabs">'+cats.map(function(c,i){return '<div class="ut '+(i===0?'on':'')+'">'+c+'</div>';}).join('')+'</div>'
 +'<div style="margin-top:8px" id="plist">'+provRows()+'</div>'
 +'<div class="tail"></div>';}

S.q='';
function searchRows(){
 const q=(S.q||'').trim().toLowerCase();
 let rows;
 if(!q)rows=['BTC','ETH','BNB'].map(function(s){return {s:s,n:nameOf(s),i:iconOf(s),img:imgOf(s),p:priceOf(s),c:chgOf(s),sym:1};});
 else{const seen={};rows=[];
  CATALOG.forEach(function(c){if(c[0].toLowerCase().indexOf(q)>=0||c[1].toLowerCase().indexOf(q)>=0){seen[c[3]]=1;
   rows.push({s:c[0],n:c[1],i:c[2],img:imgOf(c[0]),p:priceOf(c[0]),c:chgOf(c[0]),sym:1});}});
  (TOP||[]).forEach(function(x){if(!seen[x.id]&&(String(x.s).toLowerCase().indexOf(q)>=0||String(x.n).toLowerCase().indexOf(q)>=0)){seen[x.id]=1;
   rows.push({id:x.id,s:x.s,n:x.n,i:iconForId(x.id),img:safeUrl(x.img),p:x.p,c:x.c||0});}});
  rows=rows.slice(0,40);}
 if(!rows.length)return '<div class="empty" style="padding:60px 30px"><p>No results for \u201c'+esc(S.q)+'\u201d</p></div>';
 return '<div class="h2" style="font-size:19px;padding-top:16px;display:flex;align-items:center;gap:5px">'+(q?'Results':'Crypto')+' <span style="color:var(--sub)">'+CHEV+'</span></div>'
 +rows.map(function(r){const on=r.id?'openCoin(\''+jsid(r.id)+'\')':'openTok(\''+esc(r.n).replace(/'/g,"\\'")+'\')';
  return '<div class="row" style="height:56px" onclick="S.from=\'search\';'+on+'">'+ic(r.i,34,r.img)
  +'<div class="mid"><div class="t1" style="font-size:15px">'+esc(r.n)+'</div><div class="t2">'+esc(r.s)+'</div></div>'
  +'<div><div class="r1" style="font-size:15px">'+pxs(r.p)+' <span style="color:'+cc(r.c)+';font-size:13px">'+(r.c>=0?'\u25b2':'\u25bc')+pc(r.c)+'</span></div></div></div>';}).join('');}
function vSearch(){
 return '<div class="tb" style="gap:10px;padding-right:var(--m)"><button class="ib" onclick="S.q=\'\';back()">'+BACK+'</button>'
 +'<div class="sfield on" style="flex:1;margin:0;height:42px">'+SRCH+'<input class="txt" id="sq" placeholder="Search asset" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" value="'+esc(S.q)+'" oninput="S.q=this.value;document.getElementById(\'sres\').innerHTML=searchRows()"></div></div>'
 +'<div id="sres">'+searchRows()+'</div>'
 +'<div class="h2" style="font-size:19px;padding-top:14px;display:flex;align-items:center;gap:5px">Stocks <span style="color:var(--sub)">'+CHEV+'</span></div>'
 +'<div class="chips">'+STOCKS.slice(0,8).map(function(t){return '<div class="chip" style="font-size:12.5px;padding:5px 11px 5px 5px"><div class="ic" style="width:22px;height:22px;font-size:10px;background:'+(SCOL[t]||'#333')+';color:#fff">'+t[0]+'</div>'+t+'</div>';}).join('')+'</div>'
 +'<div class="tail"></div>';}

/* Earn: rates shown on the Earn screen, applied to what you hold */
const EARN_RATE={ETH:2.60,SOL:5.04,USDT:3.98,USDC:3.65,DAI:1.06};
function earnTap(icon){const s=symForIcon(icon);if(s){S.from='home';openTok(nameOf(s));}}
const HOWTO={Rewards:'Some assets can be staked or deposited with a provider. In return the provider pays rewards, usually as more of the same asset. Rates vary and are not guaranteed.',
 'Time Commitment':'Some staking locks your assets for a period, and withdrawals can take days to process. Other options let you withdraw at any time. Check the terms before depositing.',
 Security:'With a Ledger device, staking is signed on the device and your keys never leave it. Rewards come from third-party providers, so their risks still apply.'};
function extraSheets(){
 if(S.info==='device')return smallSheet('Add a Ledger','<div class="info"><p>Pairing a Ledger device needs Bluetooth or USB, which this app can\u2019t use. It tracks balances you enter, so you can add what your Ledger holds by hand.</p></div>'
  +'<div class="act"><button class="ghost" onclick="S.info=null;drawOv();openExt(\'https://www.ledger.com/ledger-live\')">Get Ledger Wallet</button>'
  +'<button class="save" onclick="S.info=null;drawOv();openAdd(\'receive\')">Add crypto</button></div>');
 if(S.info==='sim'){
  const rows=heldSyms().filter(function(s){return EARN_RATE[s];}).map(function(s){const v=HOLD[s]*priceOf(s),y=v*EARN_RATE[s]/100;
   return '<div class="qr"><span>'+ic(iconOf(s),22,imgOf(s))+' '+s+' <span class="dim">~'+EARN_RATE[s].toFixed(2)+'%</span></span><b>'+(HIDE?'\u2022\u2022\u2022':money(y))+' / yr</b></div>';});
  const tot=heldSyms().reduce(function(a,s){return a+(EARN_RATE[s]?HOLD[s]*priceOf(s)*EARN_RATE[s]/100:0);},0);
  return smallSheet('Simulate rewards',rows.length
   ?('<div class="qcard">'+rows.join('')+'<div class="qr tot"><span>Estimated total</span><b>'+(HIDE?'\u2022\u2022\u2022':money(tot))+' / yr</b></div></div>'
     +'<div class="note2">Based on the rates on the Earn screen and today\u2019s prices. Rewards are not guaranteed and rates change.</div>')
   :('<div class="info"><p>Add ETH, SOL, USDT, USDC or DAI to your wallet to see what they could earn at the rates on the Earn screen.</p></div>'
     +'<div class="act"><button class="save" onclick="S.info=null;drawOv();openAdd(\'receive\')">Add crypto</button></div>'));}
 if(S.info&&S.info.indexOf('how:')===0){const k=S.info.slice(4);
  return smallSheet(esc(k),'<div class="info"><p>'+esc(HOWTO[k]||'')+'</p></div>');}
 return swSheets()||setSheets();}

   BOOT
   ============================================================ */
if(SET.cur!=='USD'&&(!curRate()||!FX||Date.now()-FX.at>36e5))setTimeout(loadFx,2500);
if(SET.lock)showLock('unlock');
draw();
refresh(true);
</script>
